name: release
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      # To create the GitHub release
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the release
        uses: actions/github-script@v9
        with:
          script: |
            const { checkRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.ts`);
            await checkRelease({ github, context, branch: 'master', crate: 'rnix' });

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const { createRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.ts`);
            await createRelease({ github, context });
